[workspace]
resolver = "3"
members = ["crates/physcad", "crates/physcad-view"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
physcad = { path = "crates/physcad" }
glam = { version = "0.34", features = ["bytemuck"] }
wgpu = "30.0"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
single_match_else = "allow"  # iterator chains over if/else read better here
module_name_repetitions = "allow"  # crate names already carry the prefix
